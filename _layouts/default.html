<!DOCTYPE html>
<html lang="{{ site.lang | default: 'tr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% if page.matematik %}
  <script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Dersler</a>
        <a href="{{ '/hakkinda/' | relative_url }}">Hakkında</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      © {{ 'now' | date: '%Y' }} {{ site.author }}
      {% if site.email %}· <a href="mailto:{{ site.email }}">{{ site.email }}</a>{% endif %}
    </div>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
